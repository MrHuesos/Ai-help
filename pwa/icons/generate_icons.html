<!DOCTYPE html>
<!-- Abre este archivo en un navegador, luego haz clic en los botones para descargar los íconos -->
<html>
<body style="font-family:sans-serif;padding:20px;background:#f5f5f5">
<h2>Generador de íconos</h2>
<p>Haz clic en cada botón para descargar el ícono y colócalo en la carpeta <code>pwa/icons/</code></p>
<canvas id="c" style="display:none"></canvas>
<button onclick="gen(192)">Descargar icon-192.png</button>
<button onclick="gen(512)">Descargar icon-512.png</button>
<script>
function gen(size) {
  const c = document.getElementById('c');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const r = size * 0.21;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#34C759';
  ctx.fill();
  ctx.font = `${size * 0.52}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💰', size / 2, size / 2);
  const a = document.createElement('a');
  a.download = `icon-${size}.png`;
  a.href = c.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
